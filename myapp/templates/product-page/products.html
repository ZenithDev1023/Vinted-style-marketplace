{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Products Page</title>
    <link rel="stylesheet" type="text/css" href="{% static 'products-page/products.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'styles/styles.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <!-- Hamburger Button (Far Left) -->
            <span id="openNavBtn" style="font-size:30px;cursor:pointer;color:white;">&#9776;</span>

            <!-- Logo (Left) -->
            <a href="{% url 'home' %}" class="logo">
                <img src="{% static 'images/tradex-logo.png' %}" alt="TradeX Logo">
                <span>TradeX</span>
            </a>

            <!-- Search Bar (Center) -->
            <form class="search-bar" method="GET" action="{% url 'products' %}">
                <input type="text" 
                    name="q" 
                    placeholder="Search tools, equipment, materials..." 
                    value="{{ search_query }}">
                <button type="submit" class="search-btn">
                    <i class="fas fa-search"></i> Search
                </button>
            </form>

            <!-- Auth Buttons (Right) -->
            <div class="nav-actions">
                {% if user_id %}
                    <span class="user-greeting">Hi, {{ user.username }}!</span>
                    <a href="{% url 'create_listing' %}" class="btn btn-primary">Post an Ad</a>
                    <a href="{% url 'profile' %}" class="btn btn-secondary">My Profile</a>
                    <a href="{% url 'home' %}" class="btn btn-outline">Logout</a>
                {% else %}
                    <a href="{% url 'create_listing' %}" class="btn btn-primary">Post an Ad</a>
                    <a href="{% url 'register' %}" class="btn btn-secondary">Sign Up</a>
                    <a href="{% url 'login' %}" class="btn btn-outline">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div id="mySidenav" class="sidenav">
        <a id="closeNavBtn" href="javascript:void(0)" class="closebtn">&times;</a>
        <a href="#">My Profile</a>
        <a href="#">About</a>
        <a href="{% url 'products' %}">Products</a>
        <a href="{% url 'contact' %}">Contact</a>
        <a href="{% url 'messages' %}">Messages</a>
        <a href="{% url 'settings' %}">Settings</a>
        <a href="#">Logout</a>
    </div>



    <div id="main">
        <h1>Products</h1>
            <div class="row">
                <div class="column">
                    <a href="{% url 'product_details' 1%}"><img src="{% static 'images/Hammer.jpeg' %}" alt="Hammer" class="product-image"><p>Hammer</p></a>
                    <div><img src="{% static 'images/Saw.jpeg' %}" alt="Saw" class="product-image"><p>Saw</p></div>
                    <div><img src="{% static 'images/Crowbar.jpeg' %}" alt="Crowbar" class="product-image"><p>Crowbar</p></div>
                </div>
                <div class="column">
                    <div><img src="{% static 'images/Nails.jpeg' %}" alt="Nails" class="product-image"><p>Nails</p></div>
                    <div><img src="{% static 'images/Screwdriver.webp' %}" alt="Screwdriver" class="product-image"><p>Screwdriver</p></div>
                    <div><img src="{% static 'images/WoodPlanks.jpeg' %}" alt="Wood Planks" class="product-image"><p>Wood Planks</p></div>
                </div>
            </div>
    </div>
    <script src="{% static 'products-page/products.js' %}" defer></script>
    <script src="{% static 'styles/styles.js' %}"></script>

</body>
</html>
