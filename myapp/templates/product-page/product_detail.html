{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ product.title }}</title>
    <link rel="stylesheet" href="{% static 'myapp/products-page/products.css' %}">
</head>
<body>
    <h1>{{ product.title }}</h1>
    <p>{{ product.description }}</p>
    <p>Price: £{{ product.price }}</p>
    <p>Condition: {{ product.condition }}</p>
    <p>Category: {{ product.category.name }}</p>

    <a href="{% url 'products' %}">← Back to Products</a>

    <script src="{% static 'myapp/products-page/products.js' %}"></script>
</body>
</html>
