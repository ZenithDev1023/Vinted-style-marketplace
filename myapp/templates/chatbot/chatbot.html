{% load static %}
<html>
<head>
    <title>Products Page</title>
    <link rel="stylesheet" type="text/css" href="{% static 'products-page/products.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'styles/styles.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'chatbot/chatbot.css' %}">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    {% include 'home/navbar.html' %}
    {% include 'home/sidenav.html' %}

    <!-- Chatbot floating widget -->
    <div id="chatbot-widget">
        <input type="hidden" id="chatbot-csrf-token" value="{{ csrf_token }}">
        <button id="chatbot-toggle" aria-label="Open chat assistant">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
        </button>

        <div id="chatbot-box" class="chatbot-hidden">
            <div id="chatbot-header">
                <span>Marketplace Assistant</span>
                <button id="chatbot-close" aria-label="Close chat">&#x2715;</button>
            </div>
            <div id="chatbot-messages">
                <div class="chat-msg bot-msg">Hi! I'm your marketplace assistant. Ask me anything about buying, selling, or your account.</div>
            </div>
            <div id="chatbot-input-area">
                <input type="text" id="chatbot-input" placeholder="Type a message..." autocomplete="off" />
                <button id="chatbot-send">Send</button>
            </div>
        </div>
    </div>

    {% include 'home/footer.html' %}
    <script src="{% static 'products-page/products.js' %}" defer></script>
    <script src="{% static 'styles/styles.js' %}"></script>
    <script src="{% static 'chatbot/chatbot.js' %}"></script>

</body>
</html>
