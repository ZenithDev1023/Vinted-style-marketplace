{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeX - Trade & Construction Marketplace</title>
    <link rel="stylesheet" href="{% static 'profile/profile.css' %}">
    <link rel="stylesheet" href="{% static 'home/home.css' %}">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    {% include 'home/navbar.html' %}

    {% include 'home/sidenav.html' %}


    <h1>Transaction Page</h1>



    {% include 'home/footer.html' %}

    <!-- ==================== AUTH MODAL (Login/Signup) ==================== -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('authModal')">&times;</span>
            
            <div class="modal-tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form" method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                <h2>Login</h2>
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Login</button>
            </form>

            <!-- Signup Form -->
            <form id="signupForm" class="auth-form" method="POST" action="{% url 'register' %}" style="display: none;">
                {% csrf_token %}
                <h2>Sign Up</h2>
                <div class="form-group">
                    <label for="signup-username">Username</label>
                    <input type="text" id="signup-username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Register</button>
            </form>
        </div>
    </div>

    <!-- ==================== JAVASCRIPT ==================== -->
    </div>
    <script src="{% static 'home/home.js' %}"></script>
    <script src="{% static 'styles/styles.js' %}"></script>
</body>
</html>
